# Each question's expected verdict at each wizard step. The check is on retrieval, not
# on generated prose: deterministic, cheap, and it fails for the right reason.
#
#   includes          - `value` appears in at least `min_matches` retrieved chunks
#                       (title and text; `field: title` restricts it to the title, so a
#                       document that merely cross-references another does not count)
#   everyone          - every name in `values` is the title of some retrieved chunk
#   refuses           - the answer critic ticks every item of the reference. The one
#                       check that reads prose, because a question the corpus cannot
#                       answer has no correct chunk to retrieve.
#
# `answer` is the reference answer: what a colleague who knows the corpus would say. The
# answer critic derives its checklist from it, so it decides what the room sees ticked.
#
# `note` is shown beside the answer at the steps it names: what had to be tuned before
# the technique earned its verdict. A technique that works on the first try is the
# exception, and the room should hear that from the demo rather than from experience.
#
# A step's verdict is `true`, `false`, or `partial` — measurably better than naive but
# not yet right. Only `everyone` can return `partial`, and only it can tell "found three
# of the four people" from "found all four", which is the whole AZ-900 story.
#
# Every prediction below was measured against the real corpus, not assumed. Three of the
# first draft's five questions did not survive that and were replaced.

- id: ai-tools
  question: Welke AI tools mag ik gebruiken?
  note:
    steps: [4, 5, 6]
    text: >
      Rewriting broke this answer before it fixed anything: broadening it into policy
      language filled all five slots with the AI Policy and pushed out the page that is
      the list. The prompt now keeps the question as asked in front of the broader
      phrasings.
  answer: |
    Voor consultants komen deze tools in aanmerking: ChatGPT Go/Plus, ChatGPT Business,
    Cursor Teams/Enterprise, Copilot Business/Enterprise en Claude Go/Pro/Team.
  check: {type: includes, value: "AI Policy Itenium"}
  steps: {1: true, 2: true, 3: true, 4: true, 5: true, 6: true}

# The question with no answer anywhere, and the only one that shows the refusal in the
# system prompt is real. `fietsleasing`, `fietslease`, `bedrijfsfiets`,
# `mobiliteitsbudget`, `cafetariaplan` and `fietsvergoeding` all grep to zero over the
# 2194 chunks; the `fiets` that is in there is a bike rack in the car policy and a hobby
# on a CV.
#
# Flat green, because refusing is correct at every step: this is the control, not a
# technique demo. It is also the harder half of that claim — the car policy is 36 chunks
# of plausible neighbour and fills all five slots at every step. Step 4 is where it could
# have broken: the rewriter adds "Mobiliteitsbudget alternatieven voor bedrijfswagen.
# Cafetariaplan / flexibel verloningsplan opties. Woon-werkverkeer fietsvergoeding", and
# the answer still declines to stretch the car policy over any of it.
#
# The reference says only that the corpus does not answer this, and nothing about what it
# does contain. A second, true fact about the car policy scores FAIL at four of the six
# steps: those answers name the bedrijfswagen without naming the policy, and the judge
# does not count vague where the item is specific.
- id: fietslease
  question: Ik wil geen bedrijfswagen, kan ik in de plaats een fiets leasen?
  answer: |
    Daar staat niets over in de bronnen: over fietsleasing of een alternatief voor de
    bedrijfswagen is niets terug te vinden.
  check: {type: refuses}
  steps: {1: true, 2: true, 3: true, 4: true, 5: true, 6: true}

# The one question that needs two techniques, which is why it demos both. `AZ-900`
# carries no meaning, so dense lands on the hospitalisatie folder and finds one holder;
# BM25 knows the spelling and fusion lifts it to three. Yannick Manfroy is the fourth,
# and he is out of reach of any fusion tuning: his CV chunk buries the certificate line
# under tool and framework lists, which puts him at dense rank 106 of 2194. Only the
# cross-encoder, which reads the question and the chunk together, gets him back.
#
# Five CVs contain the string. Mirko Messina's is a Udemy exam-prep course, so counting
# the string rather than the people would score a near-miss as a hit.
- id: az-900
  question: Ik wil AZ-900 halen, wie heeft dat certificaat al?
  answer: |
    Vier consultants hebben AZ-900 (Microsoft Azure Fundamentals) behaald: Igor Romy,
    Jorn Meeusen, Jos Van Loock en Yannick Manfroy. Mirko Messina hoort er niet bij: op zijn
    CV staat enkel een Udemy exam-prep cursus voor AZ-900, geen behaald certificaat.
  check:
    type: everyone
    values: [Igor Romy, Jorn Meeusen, Jos Van Loock, Yannick Manfroy]
  steps: {1: false, 2: partial, 3: true, 4: true, 5: true, 6: true}

# An over-specific question. `lader` occurs nowhere in the corpus, and `kwijt` on `trein`
# lands dense, BM25 and the cross-encoder alike on the Avis rental conditions, which do
# have a lost-property section. Three techniques agreeing on one wrong document; only
# broadening the question to lost company equipment reaches Laptop policy p. 2, article 3.
#
# The reference deliberately stops where the policy does. It names no document, because
# the generator cites `[3]` and never a title; it leaves out the damage-percentage table,
# which lives in a p. 2 chunk that does not come back; and it states that a lost charger
# is not covered, because the honest answer says so and the room should see that ticked.
- id: laptoplader
  question: Ik ben mijn laptoplader kwijt op de trein, wat nu?
  answer: |
    De werknemer moet alle zorgvuldigheid in acht nemen om beschadiging, diefstal of verlies
    te voorkomen. Schade of diefstal meld je zo spoedig mogelijk en uiterlijk binnen 24 uur bij
    de werkgever, en je laat het gebruik onmiddellijk blokkeren via de interne contactpersoon.
    Bij verwijtbare nalatigheid kan een schadebedrag aangerekend worden dat afhangt van hoe lang
    de laptop in gebruik is. De policy gaat over de laptop zelf; een verloren lader wordt niet
    apart geregeld.
  check: {type: includes, value: "Laptop policy", min_matches: 2, field: title}
  steps: {1: false, 2: false, 3: false, 4: true, 5: true, 6: true}

# The balance is a sum over a ledger. No chunk contains it, so no retrieval technique
# reaches it — only the summary computed at ingest time does.
- id: creditsaldo
  question: Hoeveel credits heeft Simon nog?
  answer: |
    Simon Verhoeven heeft nog 1894 credits.
  check: {type: includes, value: "Huidig saldo"}
  steps: {1: false, 2: false, 3: false, 4: false, 5: false, 6: true}
