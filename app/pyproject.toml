[project]
name = "rag-demo"
version = "0.1.0"
description = "Live demo for the itenium RAG & Embeddings session"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.2.0",
    "fastapi>=0.141.1",
    "numpy>=2.5.2",
    "openpyxl>=3.1.5",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.0.1",
    "umap-learn>=0.5.12",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag", "web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs the real embedding models on disk (deselect with '-m \"not slow\"')",
]
addopts = "-m 'not slow'"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
