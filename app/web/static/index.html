<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG &amp; Embeddings</title>
<link rel="icon" href="/static/favicon.ico" sizes="any">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<style>
  :root {
    --bg: #12141a; --panel: #1a1d25; --line: #2c313d;
    --ink: #e8eaf0; --dim: #8d94a5; --accent: #6ea8fe;
    --pass: #4ade80; --fail: #f87171; --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 1.5rem;
    padding: 1rem 1.5rem; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 1.1rem; margin: 0; font-weight: 600; letter-spacing: .01em; }
  header .logo { height: 1.6rem; display: block; }
  .steps { display: flex; gap: .5rem; margin-left: auto; }
  .steps button {
    background: var(--panel); color: var(--dim); border: 1px solid var(--line);
    border-radius: 6px; padding: .45rem .9rem; font: inherit; font-size: .85rem;
    cursor: pointer;
  }
  .steps button.on { background: var(--accent); border-color: var(--accent); color: #0b0d12; font-weight: 600; }
  .steps button.done { color: var(--ink); border-color: var(--accent); }
  main { display: grid; grid-template-columns: 300px 1fr; gap: 1.5rem; padding: 1.5rem; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 1.1rem; }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 0 0 .8rem; }
  .scoreboard li { list-style: none; display: flex; gap: .55rem; padding: .3rem 0; font-size: .9rem; }
  .scoreboard ul { margin: 0; padding: 0; }
  .scoreboard .v { width: 1.2rem; }
  .pass { color: var(--pass); } .fail { color: var(--fail); } .part { color: var(--warn); }
  .scoreboard button {
    background: none; border: none; color: inherit; font: inherit; text-align: left;
    cursor: pointer; padding: 0; flex: 1;
  }
  .ask { display: flex; gap: .6rem; margin-bottom: 1.2rem; }
  .ask input {
    flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: .7rem .9rem; color: var(--ink); font: inherit;
  }
  .ask button {
    background: var(--accent); color: #0b0d12; border: 0; border-radius: 8px;
    padding: .7rem 1.4rem; font: inherit; font-weight: 600; cursor: pointer;
  }
  .blurb { color: var(--dim); font-size: .9rem; margin: 0 0 1rem; }
  .rewritten { border-left: 3px solid var(--accent); padding-left: .8rem; margin-bottom: 1rem; font-size: .9rem; }
  .answer { white-space: pre-wrap; }
  .cite { color: var(--accent); font-weight: 600; }
  .source { display: flex; gap: .6rem; align-items: baseline; padding: .2rem 0; }
  .source .loc { color: var(--dim); font-size: .85rem; }

  h1.qtitle { font-size: 1.5rem; margin: 0 0 .3rem; font-weight: 600; line-height: 1.25; }
  .box {
    background: #161920; border: 1px solid var(--line); border-radius: 8px;
    padding: 1rem 1.1rem; margin-bottom: 1.1rem;
  }
  .box > h2:first-child { margin-top: 0; }
  .askrow { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.2rem; }
  .askrow .ask { margin-bottom: 0; }
  .ask select {
    flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: .7rem .9rem; color: var(--ink); font: inherit; min-width: 0;
  }
  .ask button:disabled { opacity: .4; cursor: default; }

  table.grid { width: 100%; border-collapse: collapse; font-size: .84rem; margin-bottom: 1.5rem; }
  table.grid th {
    text-align: left; font-weight: 500; color: var(--dim); font-size: .72rem;
    text-transform: uppercase; letter-spacing: .06em; padding: .3rem .5rem;
    border-bottom: 1px solid var(--line);
  }
  table.grid th .help {
    display: inline-block; margin-left: .3rem; width: 1em; height: 1em; line-height: 1em;
    border: 1px solid var(--line); border-radius: 50%; text-align: center; cursor: help;
  }
  table.grid th .help:hover { border-color: var(--accent); color: var(--accent); }
  table.grid td { padding: .45rem .5rem; border-bottom: 1px solid #21252f; vertical-align: top; }
  table.grid td.title { max-width: 24rem; }
  table.grid td.title .snip {
    display: block; color: var(--dim); font-size: .76rem; margin-top: .1rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  table.grid td.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--dim); }
  table.grid td.rank-now { color: var(--ink); font-weight: 600; }
  table.grid tr.out td { color: #6b7280; }
  table.grid tr.out td.title { text-decoration: line-through; }
  table.grid .up { color: var(--pass); } table.grid .down { color: var(--fail); }
  table.grid tr.divider td {
    border-bottom: 0; padding-top: .9rem; color: var(--dim); font-size: .72rem;
    text-transform: uppercase; letter-spacing: .06em;
  }

  .tabs { float: right; display: flex; gap: .3rem; }
  .tabs button {
    background: none; border: 1px solid var(--line); border-radius: 5px; color: var(--dim);
    font: inherit; font-size: .7rem; padding: .1rem .5rem; cursor: pointer;
    text-transform: none; letter-spacing: 0;
  }
  .tabs button.on { border-color: var(--accent); color: var(--accent); }
  .vec { margin-bottom: .7rem; }
  .vlabel { display: flex; gap: .6rem; font-size: .78rem; color: var(--dim); margin-bottom: .15rem; }
  .vlabel .cos { margin-left: auto; color: var(--accent); font-variant-numeric: tabular-nums; }
  .nums {
    display: block; font-size: .74rem; color: #c3c8d4; white-space: pre; overflow-x: auto;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  .strip { display: flex; height: 1.1rem; border-radius: 3px; overflow: hidden; }
  .strip i { flex: 1; display: block; }
  #resultmap { height: 260px; margin-bottom: 1.5rem; }

  details.advanced { margin-top: 1.5rem; font-size: .85rem; color: var(--dim); }
  details.advanced label { margin-right: 1rem; }
  #map { height: 620px; }
  .error { color: var(--fail); }
</style>
</head>
<body x-data="demo()" x-init="init()">

<header>
  <img class="logo" src="/static/logo.svg" alt="itenium">
  <h1>RAG &amp; Embeddings</h1>
  <nav class="steps">
    <button @click="goto(0)" :class="step === 0 ? 'on' : ''">0 · Map</button>
    <template x-for="s in steps" :key="s.number">
      <button @click="goto(s.number)"
              :class="step === s.number ? 'on' : (step > s.number ? 'done' : '')"
              x-text="s.number + ' · ' + s.name"></button>
    </template>
  </nav>
</header>

<main x-show="step === 0" style="grid-template-columns: 1fr">
  <section class="panel">
    <h2>
      The map of meaning
      <span class="tabs">
        <button @click="toggleGroups()" :class="groupsOn ? 'on' : ''"
                x-text="groupsOn ? 'hide groups' : 'show groups'"></button>
      </span>
    </h2>
    <div class="askrow">
      <form class="ask" @submit.prevent="plotQuery(mapQuestion)">
        <input x-model="mapQuestion" placeholder="Drop a question on the map…">
        <button type="submit">Find</button>
      </form>
      <form class="ask" @submit.prevent="plotQuery(mapPicked)">
        <select x-model="mapPicked">
          <option value="">Prepared questions…</option>
          <template x-for="q in questions" :key="q.id">
            <option :value="q.question"
                    x-text="(q.demo_at ? 'step ' + q.demo_at : 'never') + ' · ' + q.question"></option>
          </template>
        </select>
        <button type="submit" :disabled="!mapPicked">Find</button>
      </form>
    </div>
    <div id="map"></div>
  </section>
</main>

<main x-show="step > 0">
  <aside class="panel scoreboard">
    <h2>Scoreboard</h2>
    <ul>
      <template x-for="q in questions" :key="q.id">
        <li>
          <span class="v" :class="verdictClass(q)" x-text="verdictMark(q)"></span>
          <button @click="askEverywhere(q.question)" x-text="q.question"></button>
        </li>
      </template>
    </ul>
    <details class="advanced">
      <summary>Advanced</summary>
      <template x-for="flag in ['dense','bm25','rerank','rewrite','citations']" :key="flag">
        <label>
          <input type="checkbox" :checked="config()[flag]" @change="override(flag, $event.target.checked)">
          <span x-text="flag"></span>
        </label>
      </template>
    </details>
  </aside>

  <section class="panel">
    <p class="blurb" x-text="current().blurb"></p>
    <div class="askrow">
      <form class="ask" @submit.prevent="ask(question)">
        <input x-model="question" placeholder="Ask something…">
        <button type="submit" x-text="loading ? '…' : 'Find'"></button>
      </form>
      <form class="ask" @submit.prevent="askEverywhere(picked)">
        <select x-model="picked">
          <option value="">Prepared questions…</option>
          <template x-for="q in questions" :key="q.id">
            <option :value="q.question"
                    x-text="(q.demo_at ? 'step ' + q.demo_at : 'never') + ' · ' + q.question"></option>
          </template>
        </select>
        <button type="submit" :disabled="!picked">Find</button>
      </form>
    </div>

    <p class="error" x-show="error" x-text="error"></p>

    <template x-if="result">
      <div>
        <h1 class="qtitle" x-text="result.question"></h1>
        <p class="rewritten" x-show="result.rewritten">
          Searched for: <em x-text="result.rewritten"></em>
        </p>

        <div class="box">
          <h2>Answer</h2>
          <div class="answer" x-html="answerHtml()"></div>
        </div>

        <div class="box" x-show="result.citations.length">
          <h2>Sources</h2>
          <template x-for="c in sources()" :key="c.marker">
            <div class="source">
              <span class="cite" x-text="'[' + c.marker + ']'"></span>
              <span x-text="c.title"></span>
              <span class="loc" x-text="sourceLoc(c)"></span>
            </div>
          </template>
        </div>

        <div class="box">
        <h2>What came back</h2>
        <table class="grid">
          <thead>
            <tr>
              <th>#<span class="help" title="Position in the final list.">?</span></th>
              <th>Δ<span class="help" title="How far reranking moved this chunk: its fused rank minus its rerank rank. ▲ up, ▼ down.">?</span></th>
              <th>title<span class="help" title="The chunk's title — the CV owner or the policy name. Hover the grey text for the whole chunk.">?</span></th>
              <th>type<span class="help" title="Where the chunk came from: cv, policy, project, credit or aggregate.">?</span></th>
              <th style="text-align:right">page<span class="help" title="Page number, read out of the chunk's location. BambooHR records have no pages.">?</span></th>
              <th style="text-align:right">dense<span class="help" title="Rank in the cosine ranking, 1 = nearest to the question vector. — = outside the top 50.">?</span></th>
              <th style="text-align:right">bm25<span class="help" title="Rank in the keyword ranking, 1 = best BM25 score. — = the chunk contains none of the query terms.">?</span></th>
              <th style="text-align:right">fused<span class="help" title="Rank after reciprocal rank fusion of the two columns to the left, before reranking: 1/(60+dense) + 1/(60+bm25), so a chunk both retrievers found beats one only one of them found.">?</span></th>
              <th style="text-align:right">rerank<span class="help" title="Final rank from the cross-encoder, which reads the question and the chunk together. — on the steps that do not rerank.">?</span></th>
              <th style="text-align:right">cos<span class="help" title="Cosine between the question vector and the chunk vector, 0–1. A score, not a rank: dense #1 is the row with the highest cos.">?</span></th>
            </tr>
          </thead>
          <tbody>
            <template x-for="(c, i) in result.used" :key="'g' + c.id">
              <tr>
                <td x-text="i + 1"></td>
                <td :class="deltaClass(c)" x-text="delta(c)"></td>
                <td class="title">
                  <span x-text="c.title"></span>
                  <span class="snip" :title="c.text" x-text="snippet(c)"></span>
                </td>
                <td class="num" x-text="c.source_type"></td>
                <td class="num" x-text="page(c)"></td>
                <td class="num" x-text="rank(c, 'dense')"></td>
                <td class="num" x-text="rank(c, 'bm25')"></td>
                <td class="num" x-text="rank(c, 'fused')"></td>
                <td class="num rank-now" x-text="rank(c, 'rerank')"></td>
                <td class="num" x-text="c.similarity"></td>
              </tr>
            </template>
            <template x-if="dropped().length">
              <tr class="divider"><td colspan="10" x-text="droppedLabel()"></td></tr>
            </template>
            <template x-for="c in dropped()" :key="'d' + c.id">
              <tr class="out">
                <td>–</td>
                <td class="down">✗</td>
                <td class="title">
                  <span x-text="c.title"></span>
                  <span class="snip" :title="c.text" x-text="snippet(c)"></span>
                </td>
                <td class="num" x-text="c.source_type"></td>
                <td class="num" x-text="page(c)"></td>
                <td class="num" x-text="rank(c, 'dense')"></td>
                <td class="num" x-text="rank(c, 'bm25')"></td>
                <td class="num" x-text="rank(c, 'fused')"></td>
                <td class="num">—</td>
                <td class="num" x-text="c.similarity"></td>
              </tr>
            </template>
          </tbody>
        </table>
        </div>

        <div class="box">
        <h2>
          Vectors
          <span class="tabs">
            <button :class="vecView === 'numbers' ? 'on' : ''" @click="vecView = 'numbers'">Numbers</button>
            <button :class="vecView === 'strips' ? 'on' : ''" @click="vecView = 'strips'">Match</button>
          </span>
        </h2>
        <div class="vec">
          <div class="vlabel">
            <span>question</span>
            <span x-text="result.dims + ' dims'"></span>
            <span class="cos" x-show="vecView === 'strips'">cos 1.0</span>
          </div>
          <code class="nums" x-show="vecView === 'numbers'" x-text="nums(result.query_vector)"></code>
          <div class="strip" x-show="vecView === 'strips'">
            <template x-for="(w, j) in contributions(result.query_vector)" :key="j">
              <i :style="shade(w)"></i>
            </template>
          </div>
        </div>
        <template x-for="(c, i) in result.used" :key="'v' + c.id">
          <div class="vec">
            <div class="vlabel">
              <span x-text="'#' + (i + 1) + ' · ' + c.title"></span>
              <span class="cos" x-text="'cos ' + c.similarity"></span>
            </div>
            <code class="nums" x-show="vecView === 'numbers'" x-text="nums(c.vector)"></code>
            <div class="strip" x-show="vecView === 'strips'">
              <template x-for="(w, j) in contributions(c.vector)" :key="j">
                <i :style="shade(w)"></i>
              </template>
            </div>
          </div>
        </template>
        </div>

        <div class="box">
          <h2>Where the question landed</h2>
          <div id="resultmap"></div>
        </div>
      </div>
    </template>
  </section>
</main>

<script>
function demo() {
  return {
    step: 0, steps: [], questions: [], question: '', picked: '',
    mapQuestion: '', mapPicked: '', groupsOn: false, clusters: [],
    results: {}, loading: false, filling: 0, error: '', overrides: {}, points: [],
    vecView: 'numbers',

    async init() {
      this.steps = await (await fetch('/api/steps')).json();
      this.questions = await (await fetch('/api/questions')).json();
      this.points = await (await fetch('/api/map')).json();
      this.clusters = await (await fetch('/api/map/clusters')).json();
      this.drawMap();
    },

    // Kept per step: switching between two steps is how the room compares them, so
    // walking back to a step must bring its answer back with it.
    get result() { return this.results[this.step] || null; },

    current() { return this.steps[this.step - 1] || { blurb: '', config: {} }; },
    config() { return { ...this.current().config, ...this.overrides }; },

    goto(n) {
      this.step = n;
      this.overrides = {};
      this.error = '';
      // Land on the question this step exists to fix, so nobody has to remember which
      // of the five belongs where. Step 5 fixes no question — citations do not change
      // retrieval — so fall back to the nearest earlier one rather than blanking.
      const q = this.questions.filter(q => q.demo_at && q.demo_at <= n).pop();
      const asked = this.result ? this.result.question : (q ? q.question : '');
      this.question = asked;
      this.picked = asked;
      if (n === 0) this.$nextTick(() => this.drawMap());
      // Plotly draws into a div the step swap leaves untouched, so it still holds the
      // previous step's map until it is told otherwise.
      if (this.result) this.$nextTick(() => this.plotResult());
    },

    rank(chunk, stage) { return chunk.ranks[stage] ?? '—'; },

    // Three verdicts, not two: AZ-900 goes from useless to three of the four people at
    // hybrid search, and calling that a pass would hide the step that finishes the job.
    verdict(q) { return q.steps[this.step]; },
    verdictMark(q) {
      return { true: '✅', partial: '❗' }[this.verdict(q)] ?? '❌';
    },
    verdictClass(q) {
      return { true: 'pass', partial: 'part' }[this.verdict(q)] ?? 'fail';
    },

    // Locations read "AI Policy Itenium > p. 3" for anything ingested from a PDF, and
    // carry a date or a record kind for the BambooHR exports, which have no pages.
    page(chunk) { return (chunk.location.match(/p\. *(\d+)/) || [])[1] ?? '—'; },

    snippet(chunk) { return chunk.text.replace(/\s+/g, ' ').trim(); },

    delta(chunk) {
      const { fused, rerank } = chunk.ranks;
      if (fused === undefined || rerank === undefined) return '—';
      const moved = fused - rerank;
      return moved === 0 ? '—' : (moved > 0 ? '▲' : '▼') + Math.abs(moved);
    },

    deltaClass(chunk) {
      const { fused, rerank } = chunk.ranks;
      if (fused === undefined || rerank === undefined) return '';
      return fused > rerank ? 'up' : (fused < rerank ? 'down' : '');
    },

    dropped() {
      if (!this.result) return [];
      const kept = new Set(this.result.used.map(c => c.id));
      return this.result.candidates.filter(c => !kept.has(c.id)).slice(0, 5);
    },

    droppedLabel() {
      const used = this.result ? this.result.used : [];
      return used.some(c => c.ranks.rerank !== undefined) ? 'dropped by reranking' : 'below the cut';
    },

    nums(vector) {
      return vector.slice(0, 12).map(v => (v < 0 ? '' : ' ') + v.toFixed(3)).join('  ');
    },

    // One cell per dimension of what that dimension contributes to the cosine, since
    // cos = sum(q[i] * c[i]). The cells of a strip therefore add up to the number
    // beside it, and the question against itself is q[i]^2 — never negative, all green.
    //
    // Dimensions are ordered by how heavily the question weights them, so the question's
    // own strip is a bright-to-dim ramp and a chunk's red lands where it disagrees on
    // the dimensions that decided the match. Unsorted, 384 cells are visual noise.
    //
    // The scale is the question's own peak rather than each strip's, so a weaker match
    // reads as dimmer. Per-strip scaling normalises away exactly what we want to show.
    contributions(vector) {
      const query = this.result ? this.result.query_vector : null;
      if (!query) return [];
      const order = query.map((v, i) => i).sort((a, b) => Math.abs(query[b]) - Math.abs(query[a]));
      const scale = Math.max(...query.map(v => v * v)) || 1;
      return order.map(i => Math.max(-1, Math.min(1, (vector[i] * query[i]) / scale)));
    },

    shade(weight) {
      const rgb = weight >= 0 ? '74,222,128' : '248,113,113';
      // A floor, or the dimensions that contribute almost nothing read as gaps in the
      // strip rather than as the weak agreement they are.
      return `background: rgba(${rgb}, ${(0.12 + 0.88 * Math.abs(weight)).toFixed(3)})`;
    },

    override(flag, value) {
      this.overrides[flag] = value;
      if (this.question) this.ask(this.question);
    },

    // The model is told to cite in every step, so the markers are in the prose from
    // step 1. Only the citations step resolves them, and until it does they are
    // deliberately left as plain text: an unresolvable [3] is the argument for the step.
    answerHtml() {
      const escaped = this.result.answer.replace(
        /[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]),
      );
      if (!this.result.citations.length) return escaped;
      return escaped.replace(/\[(\d+)\]/g, '<span class="cite">[$1]</span>');
    },

    // Numbered order, not order of first mention: this is a reference list, and the
    // room reads it against the [n] in the prose.
    sources() {
      return [...this.result.citations].sort((a, b) => a.marker - b.marker);
    },

    // A chunk's location already starts with its title, which is printed beside it.
    sourceLoc(c) {
      return c.location.startsWith(c.title)
        ? c.location.slice(c.title.length).replace(/^\s*>\s*/, '')
        : c.location;
    },

    async answer(body) {
      return await (await fetch('/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      })).json();
    },

    async ask(question) {
      // The answer belongs to the step that asked for it, not to whichever step is on
      // screen when it arrives.
      const step = this.step;
      this.question = question;
      this.loading = true;
      this.error = '';
      const response = await this.answer({ question, config: this.config() });
      this.loading = false;
      if (response.error) { this.error = response.error; delete this.results[step]; return; }
      this.results[step] = response;
      this.$nextTick(() => this.plotResult());
    },

    // Answer the prepared questions at every step, current one first. Their answers are
    // all cached, so the other five cost seconds, and stepping through them afterwards
    // compares answers instead of waiting for them. The ticket drops a fill whose
    // question has been superseded, which would otherwise overwrite the newer answers.
    // It counts rather than holds an object: state read back out of Alpine comes back
    // as a proxy, so `!==` against the object that was put in is always true.
    async askEverywhere(question) {
      await this.ask(question);
      const asked = this.step;
      const ticket = ++this.filling;
      for (const s of this.steps) {
        if (s.number === asked) continue;
        const response = await this.answer({ question, step: s.number });
        if (this.filling !== ticket) return;
        if (!response.error) this.results[s.number] = response;
      }
    },

    traces(highlight) {
      const types = [...new Set(this.points.map(p => p.source_type))];
      const colours = { policy: '#6ea8fe', cv: '#4ade80', bamboo: '#fbbf24', project: '#f472b6' };
      return types.map(type => {
        const pts = this.points.filter(p => p.source_type === type);
        return {
          x: pts.map(p => p.x), y: pts.map(p => p.y),
          text: pts.map(p => p.title + '<br>' + p.text.slice(0, 160)),
          hoverinfo: 'text', mode: 'markers', type: 'scatter', name: type,
          marker: {
            size: pts.map(p => highlight.includes(p.id) ? 16 : 8),
            color: colours[type] || '#8d94a5',
            line: { width: pts.map(p => highlight.includes(p.id) ? 2 : 0), color: '#fff' },
          },
        };
      });
    },

    // Dotted rings, not filled blobs: the point of the map is the dots underneath.
    shapes() {
      return this.clusters.map(c => ({
        type: 'circle', xref: 'x', yref: 'y', layer: 'below',
        x0: c.x - c.rx, x1: c.x + c.rx, y0: c.y - c.ry, y1: c.y + c.ry,
        line: { color: 'rgba(232,234,240,.45)', width: 2, dash: 'dot' },
        fillcolor: 'rgba(232,234,240,.04)',
      }));
    },

    labels() {
      return this.clusters.map(c => ({
        x: c.x, y: c.y + c.ry, xref: 'x', yref: 'y', yanchor: 'bottom',
        text: c.label, showarrow: false, borderpad: 4,
        font: { size: 15, color: '#e8eaf0' }, bgcolor: 'rgba(26,29,37,.8)',
      }));
    },

    // Only the big map gets rings; the 260px result map has no room for them.
    layout(groups = false) {
      return {
        shapes: groups ? this.shapes() : [],
        annotations: groups ? this.labels() : [],
        paper_bgcolor: '#1a1d25', plot_bgcolor: '#1a1d25',
        font: { color: '#e8eaf0' }, margin: { t: 10, r: 10, b: 30, l: 30 },
        xaxis: { gridcolor: '#2c313d', zeroline: false },
        yaxis: { gridcolor: '#2c313d', zeroline: false },
        legend: { orientation: 'h' },
      };
    },

    render(element, highlight = [], query = null, groups = false) {
      const traces = this.traces(highlight);
      if (query) {
        traces.push({
          x: [query.x], y: [query.y], mode: 'markers+text', type: 'scatter',
          name: 'your question', text: ['?'], textposition: 'top center',
          textfont: { size: 18, color: '#f87171' },
          marker: { size: 20, color: '#f87171', symbol: 'x' },
        });
      }
      Plotly.newPlot(element, traces, this.layout(groups), { displayModeBar: false });
    },

    drawMap(highlight = [], query = null) { this.render('map', highlight, query, this.groupsOn); },

    toggleGroups() {
      this.groupsOn = !this.groupsOn;
      Plotly.relayout('map', {
        shapes: this.groupsOn ? this.shapes() : [],
        annotations: this.groupsOn ? this.labels() : [],
      });
    },

    // Both the step and the answer can change while this is in flight, and the map it
    // draws belongs to one step: whoever is on screen when it lands.
    async plotResult() {
      const step = this.step;
      const result = this.result;
      if (!result) return;
      const asked = result.rewritten || result.question;
      const response = await (await fetch('/api/map/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: asked, k: 5 }),
      })).json();
      if (this.step !== step || this.result !== result) return;
      this.render('resultmap', result.used.map(c => c.id), response);
    },

    async plotQuery(question) {
      if (!question) return;
      this.mapQuestion = question;
      const response = await (await fetch('/api/map/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, k: 5 }),
      })).json();
      this.drawMap(response.neighbours, response);
    },
  };
}
</script>
</body>
</html>
